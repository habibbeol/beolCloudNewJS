<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<meta name="author" content="Habib Atlouma">
<meta name="theme-color" content="#00FAFA">
<meta name="description" content="Best Movies of All Time. The movies on this list are ranked according to my perosnal opinion. The list is made to be useful to anybody who is looking for a great movie to watch away from typical lists. It does not represent any institution and is a non-commercial project.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Movies World">
<link rel="apple-touch-startup-image" href="android-chrome-192x192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<title id="page-title">Loading Movie...</title>
<link rel="stylesheet" href="movie-style.css?v=3.9">
<link rel="manifest" href="site.webmanifest">

<!-- Supabase JS Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Static styles (never change) -->
<style>
.rating-box {
  position: absolute;
  bottom: 2vmin;
  right: 27vw;
  background: rgba(0, 0, 0, 0.6);
  padding: 2px;
  border-radius: 7px;
  text-align: center;
  z-index: 20;
}
.stars span { cursor: pointer; font-size: 28px; transition: 0.2s; }
@media (max-aspect-ratio: 16/9) {
  .rating-box { bottom: 20vh; left: 0px; width: 66vw; }
}
/* While the slide animation runs, never show a sideways scrollbar */
html.is-swiping { overflow-x: hidden; }
</style>

<!-- Dynamic styles: JavaScript REPLACES the content of this tag for every movie -->
<style id="dynamic-db-styles"></style>
</head>

<body>

<div id="navHint" class="nav-hint-overlay">
  <div class="hint-side hint-left">
    <div class="hand-icon swipe-left-anim">👈</div>
    <span class="hint-text-mobile">Swipe right for previous</span>
    <span class="hint-text-desktop">Drag right for previous</span>
  </div>
  <div class="hint-side hint-right">
    <div class="hand-icon swipe-right-anim">👉</div>
    <span class="hint-text-mobile">Swipe left for next</span>
    <span class="hint-text-desktop">Drag left for next</span>
  </div>
</div>

<div class="container" id="movie-container">
  <h1 id="movie-heading">Loading...</h1>
  <p id="movie-desc"></p>
  <a id="back-button" href="index.html" style="padding:3px; display:inline-block; text-decoration: none; margin-left: 1rem;">← BACK</a>
</div>

<div class="rating-box" id="rating-box">
  <div id="status">⭐ <span id="val">0.0</span> <span id="vote-msg"></span></div>
  <div class="stars">
    <span onclick="sendVote(1)">⭐</span>
    <span onclick="sendVote(2)">⭐</span>
    <span onclick="sendVote(3)">⭐</span>
    <span onclick="sendVote(4)">⭐</span>
    <span onclick="sendVote(5)">⭐</span>
  </div>
</div>

<iframe id="trailer-frame" allowfullscreen></iframe>

<!-- Hammer.js is loaded ONCE -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>

<!-- ONE script block, every variable declared ONCE -->
<script>
// ---------- Supabase ----------
const SUPABASE_URL = 'https://npnyjarjsudbpzpdyvby.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_w82HTtIztIiPMOv7aK1oTw_XgjuLJIP';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---------- Slide animation settings (change these two numbers to taste) ----------
const SLIDE_MS = 350;            // total time: half to leave, half to arrive
const SLIDE_DISTANCE_VW = 15;    // how far the content travels, in % of the screen width

// ---------- State ----------
const urlParams = new URLSearchParams(window.location.search);
let currentId = parseInt(urlParams.get('id')) || 1;   // the movie we are going to (changes when a swipe starts)
let shownId = currentId;                               // the movie on the screen right now (used for voting)
let lastId = 100;                                      // replaced by the real value from the database
let busy = false;                                      // true while a swipe animation is running
let queuedStep = 0;                                    // a swipe made during an animation waits here

// ---------- The three things that slide together ----------
const movieContainer = document.getElementById('movie-container');
const ratingBox = document.getElementById('rating-box');
const trailerFrame = document.getElementById('trailer-frame');
const slideTargets = [movieContainer, ratingBox, trailerFrame];
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
const canAnimate = typeof Element.prototype.animate === 'function';

// ---------- Trailer ----------
// location.replace() changes the video WITHOUT adding a browser-history entry.
// (Setting iframe.src adds one each time, and the Back button would then step
// through every old trailer before leaving the page.)
function setTrailer(url) {
  const target = url || 'about:blank';
  try {
    trailerFrame.contentWindow.location.replace(target);
  } catch (e) {
    trailerFrame.src = target;
  }
}

// ---------- Leave the movie page the way the browser's Back arrow would ----------
// Plain links add a NEW history entry, so after the link the Back arrow would return
// to the movie you just left. Instead:
//  - if you came from the index page, go back to it (no new entry);
//  - otherwise (Google, a shared link...) replace this page with the index, so the
//    next Back goes to wherever you were before.
function goHome() {
  let cameFromIndex = false;
  try {
    const ref = new URL(document.referrer);
    cameFromIndex = ref.origin === location.origin && /(^|\/)(index\.html)?$/.test(ref.pathname);
  } catch (e) {}
  if (cameFromIndex && history.length > 1) {
    history.back();
  } else {
    location.replace('index.html');
  }
}

// The on-page "← BACK" link uses goHome() (the plain link still works as a fallback)
document.getElementById('back-button').addEventListener('click', e => {
  if (e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;   // keep "open in new tab" working
  e.preventDefault();
  goHome();
});

// ---------- Show a message instead of wiping the whole page ----------
function showMessage(text) {
  document.getElementById('movie-heading').innerText = text;
  document.getElementById('movie-desc').innerText = '';
  document.getElementById('dynamic-db-styles').textContent = '';
  document.getElementById('val').innerText = '0.0';
  document.getElementById('vote-msg').innerText = '';
  document.title = text;
}

// ---------- 1) Download ONE movie from Supabase (does not touch the page) ----------
async function fetchMovie(id) {
  try {
    const { data: movie, error } = await supabaseClient
      .from('movies_details')
      .select(`
        *,
        movie_ratings (
          total_points,
          total_votes
        )
      `)
      .eq('id', id)
      .maybeSingle();                 // no row = null (not an error)
    if (error) return { status: 'error' };
    if (!movie) return { status: 'missing' };
    return { status: 'ok', movie };
  } catch (e) {
    return { status: 'error' };
  }
}

// ---------- 2) Put that movie on the page. Returns the trailer address ----------
function applyMovie(id, result) {
  shownId = id;

  if (result.status === 'error') { showMessage('Could not load movie'); return ''; }
  if (result.status === 'missing') { showMessage('Movie Not Found'); return ''; }

  const movie = result.movie;

  // Rating (movie_ratings can come back as an array or as one object)
  const r = movie.movie_ratings;
  const ratingData = Array.isArray(r) ? (r[0] || null) : (r || null);
  const totalVotes = ratingData ? ratingData.total_votes : 0;
  const totalPoints = ratingData ? ratingData.total_points : 0;
  const avgScore = totalVotes > 0 ? (totalPoints / totalVotes).toFixed(1) : "0.0";
  const ranking = movie.ranking || id;

  // Fill the HTML
  document.title = movie.title;
  document.getElementById('val').innerText = avgScore;
  document.getElementById('vote-msg').innerText = '';        // clear "Voted!" from the previous movie

  const heading = document.getElementById('movie-heading');
  heading.innerText = `${ranking}. ${movie.title}`;
  heading.className = movie['lava-color'] || '';              // replace the class, don't pile them up

  document.getElementById('movie-desc').innerText = movie.description || '';

  const backBtn = document.getElementById('back-button');
  backBtn.className = movie['lava-color'] || '';
  backBtn.style.color = movie.back_button || '';

  // Dynamic CSS: "=" replaces the old movie's styles ("+=" would pile them up forever)
  document.getElementById('dynamic-db-styles').textContent = `
    body {
      background-image: url('${movie.background || ''}');
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: 100% 100%;
      background-position: center;
    }
    .container {
      width: ${movie.container_width_PC || 'auto'} !important;
      background-color: ${movie.container_BG_PC || 'transparent'};
    }
    h1 { color: ${movie.title_color_PC || '#fff'}; }
    p { color: ${movie.desc_color_PC || '#fff'}; }
    iframe { border: 1px solid ${movie.title_color_PC || '#fff'}; }
    .rating-box { border: 1px solid ${movie.title_color_PC || '#fff'}; }

    @media (max-aspect-ratio: 16/9) {
      body {
        background-image: url('${movie.background_phone || ''}');
        background-size: ${movie.BG_size_phone || 'cover'};
      }
      .container {
        width: ${movie.container_width_phone || '100%'} !important;
        background-color: ${movie.container_BG_phone || 'transparent'};
        padding-left: 0;
        padding-right: 0;
        margin: 0;
      }
      h1 { color: ${movie.title_color_phone || '#fff'}; }
      p {
        color: ${movie.desc_color_phone || '#fff'};
        width: ${movie.p_width_phone || '100%'};
        margin: 0 auto;
      }
    }
  `;

  // Download the neighbours' backgrounds now, so the next swipe shows them instantly
  preloadBackgrounds(id + 1);
  preloadBackgrounds(id - 1);

  return movie.trailer_url || '';
}

// ---------- Download a movie's background images ahead of time ----------
async function preloadBackgrounds(id) {
  if (id < 1 || id > lastId) return;
  const { data } = await supabaseClient
    .from('movies_details')
    .select('background, background_phone')
    .eq('id', id)
    .maybeSingle();
  if (!data) return;
  [data.background, data.background_phone].forEach(url => {
    if (url) new Image().src = url;   // the browser downloads it and keeps it
  });
}

// ---------- Ask the database how many movies there are ----------
async function loadLastId() {
  const { data } = await supabaseClient
    .from('movies_details')
    .select('id')
    .order('id', { ascending: false })
    .limit(1)
    .maybeSingle();
  if (data && data.id) lastId = data.id;
}

// ---------- The slide animation ----------
// "translate" is used (not "transform") so it never fights with any centering
// your movie-style.css may already do with transform.
function slide(keyframes, easing) {
  if (!canAnimate || reduceMotion.matches) return Promise.resolve();   // no animation: just swap
  document.documentElement.classList.add('is-swiping');
  return Promise.all(slideTargets.map(el =>
    el.animate(keyframes, { duration: SLIDE_MS / 2, easing: easing, fill: 'forwards' }).finished
  ));
}
function slideOut(step) {     // old content leaves: next movie (+1) leaves to the left
  return slide([
    { translate: '0 0', opacity: 1 },
    { translate: `${-step * SLIDE_DISTANCE_VW}vw 0`, opacity: 0 }
  ], 'ease-in');
}
function slideIn(step) {      // new content arrives from the opposite side
  return slide([
    { translate: `${step * SLIDE_DISTANCE_VW}vw 0`, opacity: 0 },
    { translate: '0 0', opacity: 1 }
  ], 'ease-out');
}
function clearAnimations() {
  slideTargets.forEach(el => el.getAnimations().forEach(a => a.cancel()));
  document.documentElement.classList.remove('is-swiping');
}

// ---------- Go to the next (+1) or previous (-1) movie ----------
async function goToMovie(step) {
  dismissHint();

  // A swipe during an animation is remembered and done right after
  if (busy) { queuedStep = step; return; }

  const newId = currentId + step;
  if (newId < 1 || newId > lastId) {
    goHome();                                // past the first/last movie: back to the index
    return;
  }

  busy = true;
  currentId = newId;
  // Update the address bar WITHOUT reloading and WITHOUT adding a history entry,
  // so refresh/share keeps the right movie and BACK still goes to index.html
  history.replaceState(null, '', '?id=' + newId);

  let trailerUrl = '';
  try {
    const dataPromise = fetchMovie(newId);   // start downloading right away, while the old content leaves
    await slideOut(step);
    const result = await dataPromise;
    trailerUrl = applyMovie(newId, result);  // swap the content while it is out of sight
    setTrailer('');                          // empty frame, so the old trailer is gone
    await slideIn(step);
  } catch (e) {
    console.error(e);
  } finally {
    clearAnimations();
    busy = false;
  }

  if (queuedStep) {
    const next = queuedStep;
    queuedStep = 0;
    goToMovie(next);                         // don't load a trailer that would be replaced at once
  } else {
    setTrailer(trailerUrl);                  // the video loads once the slide has finished
  }
}

// ---------- Voting ----------
async function sendVote(stars) {
  const votedId = shownId;                   // the movie you actually see on the screen

  const { data: rating } = await supabaseClient
    .from('movie_ratings')
    .select('*')
    .eq('movie_id', votedId)
    .maybeSingle();

  let newPoints = stars;
  let newVotes = 1;

  if (rating) {
    newPoints = (rating.total_points || 0) + stars;
    newVotes = (rating.total_votes || 0) + 1;
    await supabaseClient
      .from('movie_ratings')
      .update({ total_points: newPoints, total_votes: newVotes })
      .eq('movie_id', votedId);
  } else {
    await supabaseClient
      .from('movie_ratings')
      .insert([{ movie_id: votedId, total_points: newPoints, total_votes: newVotes }]);
  }

  // Only touch the screen if we are still on the movie that was voted
  if (votedId === shownId) {
    document.getElementById('val').innerText = (newPoints / newVotes).toFixed(1);
    document.getElementById('vote-msg').innerText = 'Voted!';
  }
}

// ---------- Swipe hint ----------
function dismissHint() {
  const hint = document.getElementById("navHint");
  if (hint) {
    hint.classList.add("fade-out");
    setTimeout(() => hint.remove(), 800);
  }
  try { sessionStorage.setItem("hasSeenNavHint", "true"); } catch (e) {}
}

document.addEventListener("DOMContentLoaded", () => {
  const hint = document.getElementById("navHint");
  if (!hint) return;
  let seen = false;
  try { seen = !!sessionStorage.getItem("hasSeenNavHint"); } catch (e) {}
  if (!seen) {
    setTimeout(dismissHint, 5000);           // auto-hide after 5 seconds
  } else {
    hint.remove();
  }
});

// ---------- Hammer.js swipe ----------
const mc = new Hammer(document.body);
mc.get('swipe').set({ direction: Hammer.DIRECTION_HORIZONTAL, threshold: 5, velocity: 0.1 });
mc.on("swipeleft",  () => goToMovie(+1));    // swipe left  -> next movie
mc.on("swiperight", () => goToMovie(-1));    // swipe right -> previous movie

// ---------- Start (first movie: no animation) ----------
(async function start() {
  const result = await fetchMovie(currentId);
  const trailerUrl = applyMovie(currentId, result);
  setTrailer(trailerUrl);
  loadLastId();
})();
</script>
</body>
</html>
